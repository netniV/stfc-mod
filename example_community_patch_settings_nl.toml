[graphics]

# Subgroup: Display
# -----------------

# Frame-rate scaling factor
fr_scale = 2.0

# Bepaald de tijd tussen transities, hoe hoger het getal des te trager de transitie
transition_time = 0.01

# Dit getal bepaalt de schaal van de UI. Standaardwaarde is 1.0, best incrementeren in decimaal
ui_scale = 0.6

# Dit getal bepaalt met hoeveel de schaalwaarde zich aanpast met de sneltoetsen. Standaardwaarde is 0.05
ui_scale_adjust = 0.05

# Dit bepaalt de schaalfactor voor de scheepsmodellen in de systeemweergave, waarbij 1.0 de standaardwaarde is
ui_scale_ship = 1.0

# Dit getal bepaalde de schaal van het objectscherm. Standaarwaarde is 1.0
ui_scale_viewer = 1.2

# Subgroup: Keyboard
# ------------------

# This controls the zoom speed when using Q/E in System View, defaults to 350
keyboard_zoom_speed = 350.0

# Controls the system pan momentum speed. Defaults to 0.4Bepaald de snelheid van het bewegen in een systeem. Standaardwaarde is 0.4
system_pan_momentum = 0.4

# Bepaald hoe snel het momentum vertraagt wanneer je je muis loslaat bij het bewegen in een systeem. Hoe lager de waarde hoe sneller. Standaardwaarde is 0.8
system_pan_momentum_falloff = 0.8

# Subgroup: Loader
# ----------------

# Zet dit aan om loader_image te gebruiken voor het laadscherm
loader_enabled = true

# Pad naar eigen gekozen afbeelding voor het laadscherm (laat leeg om laadscherm van de mod te gebruiken)
loader_image = ""

# Multiplier applied to the logo size on the loading screen
loader_logo_scale = 1.0

# Show the custom tip on the loading screen
loader_tip_enabled = true

# Zet dit aan om loader_image te gebruiken voor het transitiescherm
loader_transition = true

# Use a black background instead of the custom image during transitions
loader_transition_black = false

# Subgroup: Options
# -----------------

# Sta het vervangen van de muisaanwijzer van het systeem toe? (Standaard staat dit aan)
allow_cursor = true

# Staat randloos volledig scherm toe, schakel dit uit als je dit niet wilt
borderless_fullscreen = true

# Sta het vrij schalen van het venster toe, zit dit uit om het uit te schakelen
free_resize = true

# Om meer schermresoluties te zijn zet deze instelling aan
show_all_resolutions = false

# Na het gebruiken van een zoom voorinstellingen, zet de waarde als de standaardwaarde
use_presets_as_default = true

# Subgroup: Zoom
# --------------

# Zet dit op 0.0 om geen standaard systeem zoom te gebruiken met de mod;Open een systeem met een specifieke zoom
default_system_zoom = 1750.0

# Zoom voorinstelling F1 voor in een systeem
system_zoom_preset_1 = 50.0

# Zoom voorinstelling F2 voor in een systeem
system_zoom_preset_2 = 500.0

# Zoom voorinstelling F3 voor in een systeem
system_zoom_preset_3 = 1250.0

# Zoom voorinstelling F4 voor in een systeem
system_zoom_preset_4 = 2750.0

# Zoom voorinstelling F5 voor in een systeem
system_zoom_preset_5 = 5000.0

# Dit bepaalt de maximale zoomafstand in een systeem. Standaardwaarde is 2500, hoe hoger de waarde hoe langer je de labels nog kan zien als je aan het uitzoomen bent.
zoom = 5000.0

