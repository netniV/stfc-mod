[graphics]

# Subgroup: Anzeige
# -----------------

# Frame-rate scaling factor
fr_scale = 2.0

# Dauer zwischen Übergängen; erhöhen, um Übergänge zu verlangsamen
transition_time = 0.01

# Legt die Skalierung der Benutzeroberfläche fest; 1,0 ist der Standardwert
ui_scale = 0.6

# Legt fest, um welchen Betrag die Skalierung angepasst wird; 0,05 ist der Standardwert
ui_scale_adjust = 0.05

# Dies gibt an, um welchen Betrag die Schiffsmodelle in der Systemansicht skaliert werden; 1,0 ist der Standardwert
ui_scale_ship = 1.0

# Legt die Skalierung der UI-Objektansichten fest; 1,0 ist der Standardwert
ui_scale_viewer = 1.2

# Subgroup: Tastatur
# ------------------

# Steuert die Zoomgeschwindigkeit bei Verwendung von Q/E in der Systemansicht. Standardwert: 350
keyboard_zoom_speed = 350.0

# Steuert die Geschwindigkeit des System-Schwenkimpulses. Standardwert: 0,4
system_pan_momentum = 0.4

# Steuert, wie schnell der Impuls nach dem Loslassen der Maus abklingt. Niedriger = schnellerer Stopp. Standardwert: 0,8
system_pan_momentum_falloff = 0.8

# Subgroup: Ladebildschirm
# ------------------------

# Auf true setzen, um das Ladebild für den Ladebildschirm zu verwenden
loader_enabled = true

# Pfad zum benutzerdefinierten Ladebild (für das bereits im Mod eingebettete Bild leer lassen)
loader_image = ""

# Multiplier applied to the logo size on the loading screen
loader_logo_scale = 1.0

# Show the custom tip on the loading screen
loader_tip_enabled = true

# Auf true setzen, um das Ladebild für den Übergangsbildschirm zu verwenden
loader_transition = true

# Use a black background instead of the custom image during transitions
loader_transition_black = false

# Subgroup: Optionen
# ------------------

# Darf der System-Mauszeiger ersetzt werden? (Standardmäßig aktiviert)
allow_cursor = true

# Randlosen Vollbildmodus erlauben; zum Deaktivieren auf false setzen
borderless_fullscreen = true

# Freie Größenänderung erlauben; zum Deaktivieren auf false setzen
free_resize = true

# Auf true setzen, um zusätzliche Auflösungsoptionen zu aktivieren
show_all_resolutions = false

# Diese Zoom-Voreinstellung wird als Standard-Zoom festgelegt
use_presets_as_default = true

# Subgroup: Zoom
# --------------

# Auf 0,0 setzen, um den benutzerdefinierten Zoom zu deaktivieren; andernfalls das System mit dem angegebenen Zoom öffnen
default_system_zoom = 1750.0

# Zoom-Voreinstellung F1 für die Systemansicht
system_zoom_preset_1 = 50.0

# Zoom-Voreinstellung F2 für die Systemansicht
system_zoom_preset_2 = 500.0

# Zoom-Voreinstellung F3 für die Systemansicht
system_zoom_preset_3 = 1250.0

# Zoom-Voreinstellung F4 für die Systemansicht
system_zoom_preset_4 = 2750.0

# Zoom-Voreinstellung F5 für die Systemansicht
system_zoom_preset_5 = 5000.0

# Steuert die maximale Zoomentfernung in der Systemansicht. Standardwert: 2500. Höhere Werte vergrößern den Abstand der Beschriftungen
zoom = 5000.0

