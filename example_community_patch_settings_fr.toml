[graphics]

# Subgroup: Display
# -----------------

# Frame-rate scaling factor
fr_scale = 2.0

# Temps entre les transitions, augmenter pour ralentir les transitions
transition_time = 0.01

# Ceci spécifie le montant à mettre à l’échelle de l’interface utilisateur, 1.0 étant la valeur par défaut
ui_scale = 0.6

# Cela spécifie le montant à ajuster dans l’échelle, 0,05 étant la valeur par défaut
ui_scale_adjust = 0.05

# Cela spécifie le facteur de mise à l’échelle des modèles de vaisseaux dans la vue système, 1,0 étant la valeur par défaut
ui_scale_ship = 1.0

# Ceci spécifie le montant à mettre à l’échelle des visualiseurs d’objets de l’interface utilisateur, 1.0 étant la valeur par défaut
ui_scale_viewer = 1.2

# Subgroup: Keyboard
# ------------------

# Cela contrôle la vitesse de zoom lors de l’utilisation de Q/E dans la vue système, par défaut à 350
keyboard_zoom_speed = 350.0

# Permet de régler la vitesse d'inertie du panoramique du système. La valeur par défaut est 0,4.
system_pan_momentum = 0.4

# Détermine la vitesse à laquelle l'élan diminue lorsque l'on relâche le bouton de la souris. Une valeur plus faible correspond à un arrêt plus rapide. La valeur par défaut est 0,8.
system_pan_momentum_falloff = 0.8

# Subgroup: Loader
# ----------------

# mettez ça sur activer pour utiliser l'image chargée pour l'écran de chargement
loader_enabled = true

# chemin d'accès pour l'écran de chargement personnalisé (laisser vide pour l’image incorporée)
loader_image = ""

# Multiplier applied to the logo size on the loading screen
loader_logo_scale = 1.0

# Show the custom tip on the loading screen
loader_tip_enabled = true

# mettez ça sur activer pour utiliser l'image chargée pour l'écran de transition
loader_transition = true

# Use a black background instead of the custom image during transitions
loader_transition_black = false

# Subgroup: Options
# -----------------

# Autorise le curseur d'être remplacé ? (Activé par défaut)
allow_cursor = true

# Autorise le plein écran sans bordure, mettez ça sur désactiver pour désactiver
borderless_fullscreen = true

# Autorise le redimensionnement libre, mettez désactiver pour désactiver
free_resize = true

# Après avoir utilisé un préréglage de zoom, il sera défini comme zoom par défaut
use_presets_as_default = true

# Subgroup: Zoom
# --------------

# Définissez sur 0.0 pour désactiver le zoom personnalisé ; sinon, entrez dans le système au niveau de zoom spécifié
default_system_zoom = 1750.0

# Préréglage du Zoom pour F1 pour la vue système
system_zoom_preset_1 = 50.0

# Préréglage du Zoom pour F2 pour la vue système
system_zoom_preset_2 = 500.0

# Préréglage du Zoom pour F3 pour la vue système
system_zoom_preset_3 = 1250.0

# Préréglage du Zoom pour F4 pour la vue système
system_zoom_preset_4 = 2750.0

# Préréglage du Zoom pour F5 pour la vue système
system_zoom_preset_5 = 5000.0

# Ce paramètre permet de définir la distance maximale de zoom dans la vue « Système ». La valeur par défaut est 2500. Des valeurs plus élevées augmentent la distance entre les étiquettes.
zoom = 5000.0

