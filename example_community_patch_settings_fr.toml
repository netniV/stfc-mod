[ui]
# Ignorer l'animation d'ouverture des coffres et les ouvrir directement
always_skip_reveal_sequence = true
auto_confirm_discovery = true

# Open the bulk gift claim flyout automatically
auto_open_bulk_claim_flyout = false

# Empêcher "échap" de proposer de quitter le jeu
disable_escape_exit = true

# Max gap in ms for double-tap Escape to show the exit prompt.
# 0 = disabled; only applies when disable_escape_exit is true.
escape_exit_timer = 0

# ⚠️ EXPÉRIMENTAL : Empêcher la première publicité pop-up d'apparaître
disable_first_popup = false

# ⚠️ EXPÉRIMENTAL : Empêcher les touches de déplacement standard de fonctionner
disable_move_keys = false

# ⚠️ EXPÉRIMENTAL : Empêcher les bannières toast standard de fonctionner
disable_toast_banners = false

# Subgroup: Auto Confirm
# ----------------------

# Confirmer automatiquement les améliorations de niveau et de rang de Technologie interdite
auto_confirm_ft_upgrade = false

# Action à confirmer automatiquement : none, warp ou jump
auto_confirm_instant_warp = "none"

# Comma-separated ship hull names for which the instant-warp popup is always shown, overriding all automatic actions
instant_warp_always_ask = ""

# Comma-separated ship hull names to always instant jump; use "*" for all ships or leave blank for none
instant_warp_auto_jump = ""

# Comma-separated ship hull names to always regular warp; use "*" for all ships or leave blank for none
instant_warp_auto_warp = ""

# Subgroup: Banners
# -----------------

# Spécifie les types de bannières que vous ne voulez pas voir (séparés par des virgules)
disabled_banner_types = ""

# Specifies banner types that should trigger notifications (comma separated)
notify_banner_types = ""

# Subgroup: Chat
# --------------

# Mettre sur true pour retirer le chat Galaxie du jeu
disable_galaxy_chat = false

# Mettre sur true pour retirer le chat Voile du jeu
disable_veil_chat = false

# Subgroup: Chest Purchases
# -------------------------

# Maximum for tagged chest-purchase sliders on Windows; 0 disables the feature and native limits above this value are preserved
extend_chest_purchase_max = 160

# Subgroup: Objectifs quotidiens
# ------------------------------

# Factions séparées par des virgules (federation, klingon, romulan) auxquelles s'applique l'option de réclamation groupée des objectifs quotidiens ; laissez vide pour conserver le comportement par défaut du jeu
daily_bulk_claim_factions = ""

# Réactive l'option Tout réclamer des objectifs quotidiens lors du premier affichage de l'écran à chaque session
daily_bulk_claim_toggle_default_on = false

# Subgroup: Donations
# -------------------

# Étendre le curseur de don au maximum pour le niveau d'Alliance suivant
extend_donation_max = 80

# Activer l'extension du curseur de don
extend_donation_slider = true

# Subgroup: Gestion de flotte
# ---------------------------

# Utilisez les flèches gauche et droite pour sélectionner le vaisseau précédent ou suivant dans le quai de gestion de flotte
arrow_keys_to_select_ship = true

# Double-cliquez sur un vaisseau dans le quai de gestion de flotte pour l’affecter au lieu de le sélectionner puis de cliquer sur Affecter
double_click_to_assign_ship = false

# Noms de vaisseaux séparés par des virgules à toujours afficher en premier dans le quai de gestion de flotte ; les vaisseaux épinglés conservent l’ordre de tri actif
pinned_ships = ""

# Subgroup: HUD
# -------------

# HUD visibility mode: auto, show, or hide
