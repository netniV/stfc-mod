name: Create Release

on:
  push:
    tags:
      - "v*" # triggers when a tag like v0.6.1 or v0.6.1.alpha.9 is pushed

jobs:
  create-release:
    runs-on: ubuntu-latest
    name: Create Release

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Step 1 — Find a successful Build workflow for this exact commit
      - name: Check latest Build success
        id: check_build
        run: |
          echo "Checking for successful Build workflow for commit ${{ github.sha }}..."

          response=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "Build") | .id' \
            | head -n 1)

          if [ -z "$response" ]; then
            echo "❌ No successful Build workflow found for this commit."
            exit 1
          fi

          echo "✅ Found successful Build run ID: $response"
          echo "build_run_id=$response" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 2 — Download only the final Build artifacts

      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: stfc-community-mod
          path: stfc-community-mod
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.check_build.outputs.build_run_id }}

      - name: Download macOS universal archive
        uses: actions/download-artifact@v8
        with:
          name: stfc-community-mod-macos-universal
          path: stfc-community-mod-macos-universal
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.check_build.outputs.build_run_id }}

      - name: Download macOS installer
        uses: actions/download-artifact@v8
        with:
          name: stfc-community-mod-installer
          path: stfc-community-mod-installer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.check_build.outputs.build_run_id }}

      # Step 3 — Validate downloaded release inputs
      - name: Validate Build artifacts
        run: |
          test -f stfc-community-mod/version.dll

          test -f \
            stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst

          test -f \
            stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst.sha256

          test -f \
            stfc-community-mod-installer/stfc-community-mod-installer.dmg

      # Step 4 — Package legacy ZIP
      - name: Package
        run: |
          (cd stfc-community-mod && zip -r - .) > stfc-community-mod.zip

      # Step 5 — Package Windows mod archive
      - name: Package Windows mod archive
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

          mkdir -p stfc-community-mod-windows-x64

          tar -cf - \
            -C stfc-community-mod \
            version.dll \
            | zstd -19 -T0 \
              -o stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst

          sha256sum \
            stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst \
            | awk '{print $1}' \
            > stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst.sha256

      # Step 6 — Detect prerelease
      - name: Check Prerelease
        id: check-prerelease
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.(alpha|beta)\.[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Step 7 — Create Release
      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generateReleaseNotes: true
          prerelease: ${{ steps.check-prerelease.outputs.prerelease }}

      # Step 8 — Upload release assets

      - name: Upload Community Mod - Standard
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./stfc-community-mod.zip
          asset_name: stfc-community-mod.zip
          asset_content_type: application/zip

      - name: Upload Community Mod - Versioned
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./stfc-community-mod.zip
          asset_name: stfc-community-mod-${{ github.ref_name }}.zip
          asset_content_type: application/zip

      - name: Upload Community Mod - Windows Archive
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst
          asset_name: stfc-community-mod-windows-x64.tar.zst
          asset_content_type: application/zstd

      - name: Upload Community Mod - Windows Archive Checksum
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst.sha256
          asset_name: stfc-community-mod-windows-x64.tar.zst.sha256
          asset_content_type: text/plain

      - name: Upload Community Mod - macOS Archive
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst
          asset_name: stfc-community-mod-macos-universal.tar.zst
          asset_content_type: application/zstd

      - name: Upload Community Mod - macOS Archive Checksum
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst.sha256
          asset_name: stfc-community-mod-macos-universal.tar.zst.sha256
          asset_content_type: text/plain

      - name: Upload Community Mod - Mac Installer
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./stfc-community-mod-installer/stfc-community-mod-installer.dmg
          asset_name: stfc-community-mod-installer.dmg
          asset_content_type: application/x-apple-diskimage
