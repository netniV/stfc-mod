name: Create Release

on:
  push:
    tags:
      - "v*" # v0.6.1 or v0.6.1.alpha.9

permissions: {}

jobs:
  resolve-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      build_run_id: ${{ steps.build.outputs.build_run_id }}
      signing_enabled: ${{ steps.build.outputs.signing_enabled }}
    steps:
      - name: Select successful build of the tagged commit
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: |
          set -euo pipefail
          case "$SIGNING_ENABLED" in
            true|false) ;;
            '') SIGNING_ENABLED=false ;;
            *) echo '::error::MACOS_SIGNING_ENABLED must be true, false, or unset'; exit 1 ;;
          esac
          # Resolve once so signing and publication consume the same build.
          runs=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$SOURCE_SHA&status=success&per_page=100")
          build_run_id=$(jq -r --arg enabled "$SIGNING_ENABLED" --arg sha "$SOURCE_SHA" --arg repo "$GH_REPO" '
            [.workflow_runs[] | select(.name == "Build") |
              select($enabled != "true" or
                (.head_sha == $sha and .event == "push" and
                 (.head_branch == "main" or .head_branch == "dev") and
                 .path == ".github/workflows/ci.yaml" and .status == "completed" and
                 .conclusion == "success" and .repository.full_name == $repo))]
            | first | .id // empty' <<< "$runs")
          if [[ ! "$build_run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::No eligible successful Build for $SOURCE_SHA (signing=$SIGNING_ENABLED)"
            exit 1
          fi
          echo "build_run_id=$build_run_id" >> "$GITHUB_OUTPUT"
          echo "signing_enabled=$SIGNING_ENABLED" >> "$GITHUB_OUTPUT"

  sign-macos:
    needs: resolve-build
    if: needs.resolve-build.outputs.signing_enabled == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    environment: macos-release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download exact build installer
        uses: actions/download-artifact@v8.0.1
        with:
          name: stfc-community-mod-installer
          path: unsigned-macos
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve-build.outputs.build_run_id }}

      - name: Sign, notarize and package
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          BUILD_RUN_ID: ${{ needs.resolve-build.outputs.build_run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/sign-macos-release.sh

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/stfc-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/stfc-signing.keychain-db"
          fi

      - name: Upload notarization evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-notarization-evidence
          path: macos-notarization-evidence/
          if-no-files-found: ignore
          retention-days: 30

      - name: Retain exact submitted payloads for delayed notarization
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-notarization-payloads
          path: macos-notarization-payloads/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload signed macOS release
        uses: actions/upload-artifact@v7.0.1
        with:
          name: signed-macos-release
          path: signed-macos/
          if-no-files-found: error
          retention-days: 30

  create-release:
    name: Create Release
    needs: [resolve-build, sign-macos]
    if: >-
      !cancelled() && needs.resolve-build.result == 'success' &&
      ((needs.resolve-build.outputs.signing_enabled == 'true' && needs.sign-macos.result == 'success') ||
       (needs.resolve-build.outputs.signing_enabled == 'false' && needs.sign-macos.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      # Download only release-facing CI artifacts.
      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: stfc-community-mod
          path: stfc-community-mod
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-build.outputs.build_run_id }}

      - name: Download macOS universal archive
        if: needs.resolve-build.outputs.signing_enabled != 'true'
        uses: actions/download-artifact@v8
        with:
          name: stfc-community-mod-macos-universal
          path: stfc-community-mod-macos-universal
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-build.outputs.build_run_id }}

      - name: Download macOS installer
        if: needs.resolve-build.outputs.signing_enabled != 'true'
        uses: actions/download-artifact@v8
        with:
          name: stfc-community-mod-installer
          path: stfc-community-mod-installer
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-build.outputs.build_run_id }}

      - name: Download signed macOS release
        if: needs.resolve-build.outputs.signing_enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: signed-macos-release
          path: signed-macos

      - name: Use signed macOS artifacts
        if: needs.resolve-build.outputs.signing_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stfc-community-mod-macos-universal stfc-community-mod-installer
          cp signed-macos/stfc-community-mod-macos-universal.tar.zst* stfc-community-mod-macos-universal/
          cp signed-macos/stfc-community-mod-installer.dmg stfc-community-mod-installer/
          test -f signed-macos/macos-provenance.json

      - name: Validate Build artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -f stfc-community-mod/version.dll

          test -f \
            stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst

          test -f \
            stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst.sha256

          test -f \
            stfc-community-mod-installer/stfc-community-mod-installer.dmg

      # Legacy Windows ZIP.
      #
      # Keep both historical names as release assets.
      - name: Package legacy Windows ZIPs
        shell: bash
        run: |
          set -euo pipefail

          (
            cd stfc-community-mod
            zip -9 -q -r ../stfc-community-mod.zip .
          )

          cp \
            stfc-community-mod.zip \
            "stfc-community-mod-${{ github.ref_name }}.zip"

      # Native Windows archive used by newer installers/updaters.
      - name: Package Windows mod archive
        shell: bash
        run: |
          set -euo pipefail

          command -v zstd >/dev/null

          mkdir -p stfc-community-mod-windows-x64

          tar -cf - \
            -C stfc-community-mod \
            version.dll \
            | zstd -15 -T0 \
              -o stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst

          sha256sum \
            stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst \
            | awk '{print $1}' \
            > stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst.sha256

      - name: Check Prerelease
        id: check-prerelease
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.(alpha|beta)\.[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Create the release and upload every release asset in one action.
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}

          generateReleaseNotes: true
          prerelease: ${{ steps.check-prerelease.outputs.prerelease }}

          artifactErrorsFailBuild: true

          artifacts: |
            stfc-community-mod.zip
            stfc-community-mod-${{ github.ref_name }}.zip
            stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst
            stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst.sha256
            stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst
            stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst.sha256
            stfc-community-mod-installer/stfc-community-mod-installer.dmg
            ${{ needs.resolve-build.outputs.signing_enabled == 'true' && 'signed-macos/macos-provenance.json' || '' }}
