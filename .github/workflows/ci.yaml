name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XMAKE_VERSION: "3.1.0"
  XMAKE_CACHE_SCHEMA: "v2"

jobs:
  build-win:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: "recursive"
          show-progress: false

      - name: Setup XMake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
          package-cache: true
          package-cache-key: windows-x64-release-${{ env.XMAKE_CACHE_SCHEMA }}-${{ hashFiles('xmake-packages/**/xmake.lua') }}

          # Compiler/object build cache.
          build-cache: true
          build-cache-key: windows-x64-release-${{ env.XMAKE_CACHE_SCHEMA }}

      - name: Configure
        id: configure_windows
        timeout-minutes: 20
        run: xmake f -m release -y

      - name: Upload configure diagnostics
        if: ${{ failure() && steps.configure_windows.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: xmake-configure-diagnostics-windows
          path: ~/.xmake/cache/packages/**/installdir.failed/logs/install.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 3

      - name: Build
        run: xmake -y

      - name: Package
        shell: pwsh
        run: |
          Move-Item `
            "build/windows/x64/release/stfc-community-mod.dll" `
            "version.dll"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: stfc-community-mod
          path: version.dll
          compression-level: 0
          if-no-files-found: error

  build-mac:
    name: build-mac (${{ matrix.arch }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            artifact: macos-arm64-build

          - arch: x86_64
            runner: macos-26-intel
            artifact: macos-x86_64-build

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: "recursive"
          show-progress: false

      - name: Setup XMake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}

          package-cache: true
          package-cache-key: macos-${{ matrix.arch }}-release-${{ env.XMAKE_CACHE_SCHEMA }}-${{ hashFiles('xmake-packages/**/xmake.lua') }}

          build-cache: true
          build-cache-key: macos-${{ matrix.arch }}-release-${{ env.XMAKE_CACHE_SCHEMA }}

      - name: Configure
        id: configure
        timeout-minutes: 20
        run: >
          xmake f
          -p macosx
          -a "${{ matrix.arch }}"
          -m release
          -y
          --target_minver=13.5

      - name: Upload configure diagnostics
        if: ${{ failure() && steps.configure.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: xmake-configure-diagnostics-macos-${{ matrix.arch }}
          path: ~/.xmake/cache/packages/**/installdir.failed/logs/install.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 3

      - name: Build
        run: xmake -y

      - name: Verify portable macOS linkage
        shell: bash
        run: |
          set -euo pipefail

          RELEASE="build/macosx/${{ matrix.arch }}/release"

          check_linkage() {
            local binary="$1"
            local deps

            echo
            echo "==> $binary"
            deps="$(otool -L "$binary")"
            printf '%s\n' "$deps"

            if printf '%s\n' "$deps" | grep -E \
              '/opt/homebrew/|/usr/local/(opt|Cellar)/|(^|/)libssl(\.[0-9]+)*\.dylib|(^|/)libcrypto(\.[0-9]+)*\.dylib|(^|/)libcurl(\.[0-9]+)*\.dylib'
            then
              echo "::error file=$binary::Forbidden dynamic dependency detected"
              return 1
            fi
          }

          check_linkage "$RELEASE/macOSLauncher"
          check_linkage "$RELEASE/stfc-community-mod-loader"
          check_linkage "$RELEASE/libstfc-community-mod.dylib"

      - name: Finalize launcher bundle
        if: ${{ matrix.arch == 'arm64' }}
        shell: bash
        run: |
          set -euo pipefail

          APP="build/macosx/arm64/release/macOSLauncher.app"

          test -f build/macosx/arm64/release/macOSLauncher
          test -f "$APP/Contents/Resources/Assets.car"
          test -f macos-launcher/src/Info.plist

          cp macos-launcher/src/Info.plist \
            "$APP/Contents/Info.plist"

          test -f "$APP/Contents/Info.plist"

      # Only transfer the files needed by package-mac instead of the
      # complete XMake release directory.
      - name: Package intermediate build
        shell: bash
        run: |
          set -euo pipefail

          RELEASE="build/macosx/${{ matrix.arch }}/release"
          ARCHIVE="macos-${{ matrix.arch }}-build.tar"

          test -f "$RELEASE/macOSLauncher"
          test -f "$RELEASE/stfc-community-mod-loader"
          test -f "$RELEASE/libstfc-community-mod.dylib"

          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            test -d "$RELEASE/macOSLauncher.app"

            tar -cf "$ARCHIVE" \
              -C "$RELEASE" \
              macOSLauncher \
              stfc-community-mod-loader \
              libstfc-community-mod.dylib \
              macOSLauncher.app
          else
            tar -cf "$ARCHIVE" \
              -C "$RELEASE" \
              macOSLauncher \
              stfc-community-mod-loader \
              libstfc-community-mod.dylib
          fi

      - name: Upload intermediate build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: macos-${{ matrix.arch }}-build.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  package-mac:
    name: package-mac
    needs: build-mac
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
          show-progress: false

      - name: Download ARM64 build
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64-build
          path: .artifacts/arm64

      - name: Download x86_64 build
        uses: actions/download-artifact@v8
        with:
          name: macos-x86_64-build
          path: .artifacts/x86_64

      - name: Restore architecture builds
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/macosx/arm64/release
          mkdir -p build/macosx/x86_64/release

          tar -xf .artifacts/arm64/macos-arm64-build.tar \
            -C build/macosx/arm64/release

          tar -xf .artifacts/x86_64/macos-x86_64-build.tar \
            -C build/macosx/x86_64/release

          test -f build/macosx/arm64/release/macOSLauncher
          test -f build/macosx/x86_64/release/macOSLauncher

          test -f build/macosx/arm64/release/stfc-community-mod-loader
          test -f build/macosx/x86_64/release/stfc-community-mod-loader

          test -f build/macosx/arm64/release/libstfc-community-mod.dylib
          test -f build/macosx/x86_64/release/libstfc-community-mod.dylib

          test -f \
            build/macosx/arm64/release/macOSLauncher.app/Contents/Resources/Assets.car

          test -f \
            build/macosx/arm64/release/macOSLauncher.app/Contents/Info.plist

      - name: Create universal App Bundle
        shell: bash
        run: |
          set -euo pipefail

          APP="build/macosx/arm64/release/macOSLauncher.app"

          lipo -create \
            build/macosx/arm64/release/macOSLauncher \
            build/macosx/x86_64/release/macOSLauncher \
            -output "$APP/Contents/MacOS/macOSLauncher"

          lipo -create \
            build/macosx/arm64/release/stfc-community-mod-loader \
            build/macosx/x86_64/release/stfc-community-mod-loader \
            -output "$APP/Contents/stfc-community-mod-loader"

          lipo -create \
            build/macosx/arm64/release/libstfc-community-mod.dylib \
            build/macosx/x86_64/release/libstfc-community-mod.dylib \
            -output "$APP/Contents/libstfc-community-mod.dylib"

          cp assets/launcher.icns \
            "$APP/Contents/Resources/"

          mv \
            build/macosx/arm64/release/macOSLauncher.app \
            "build/macosx/arm64/release/STFC Community Mod.app"

          FINAL_APP="build/macosx/arm64/release/STFC Community Mod.app"

          test -f "$FINAL_APP/Contents/Info.plist"
          test -f "$FINAL_APP/Contents/Resources/Assets.car"
          test -f "$FINAL_APP/Contents/Resources/launcher.icns"
          test -f "$FINAL_APP/Contents/MacOS/macOSLauncher"
          test -f "$FINAL_APP/Contents/stfc-community-mod-loader"
          test -f "$FINAL_APP/Contents/libstfc-community-mod.dylib"

      - name: Verify universal binaries
        shell: bash
        run: |
          set -euo pipefail

          APP="build/macosx/arm64/release/STFC Community Mod.app"

          verify_universal() {
            local file="$1"
            local archs

            archs="$(lipo -archs "$file")"
            echo "$file: $archs"

            [[ " $archs " == *" arm64 "* ]]
            [[ " $archs " == *" x86_64 "* ]]
          }

          verify_universal \
            "$APP/Contents/MacOS/macOSLauncher"

          verify_universal \
            "$APP/Contents/stfc-community-mod-loader"

          verify_universal \
            "$APP/Contents/libstfc-community-mod.dylib"

      - name: Verify universal app linkage
        shell: bash
        run: |
          set -euo pipefail
      
          APP="build/macosx/arm64/release/STFC Community Mod.app"
      
          check_linkage() {
            local binary="$1"
            local deps
      
            echo
            echo "==> $binary"
            deps="$(otool -L "$binary")"
            printf '%s\n' "$deps"
      
            if printf '%s\n' "$deps" | grep -E \
              '/opt/homebrew/|/usr/local/(opt|Cellar)/|(^|/)libssl(\.[0-9]+)*\.dylib|(^|/)libcrypto(\.[0-9]+)*\.dylib|(^|/)libcurl(\.[0-9]+)*\.dylib'
            then
              echo "::error file=$binary::Forbidden dynamic dependency detected"
              return 1
            fi
          }
      
          check_linkage "$APP/Contents/MacOS/macOSLauncher"
          check_linkage "$APP/Contents/stfc-community-mod-loader"
          check_linkage "$APP/Contents/libstfc-community-mod.dylib"

      - name: Sign App Bundle
        shell: bash
        run: |
          set -euo pipefail

          codesign \
            --force \
            --verify \
            --verbose \
            --deep \
            --sign "-" \
            "build/macosx/arm64/release/STFC Community Mod.app"

      - name: Install packaging tools
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail

          # zstd is currently preinstalled on the macOS 26 image.
          # Keep the fallback so the workflow remains robust if the
          # runner image changes later.
          command -v zstd >/dev/null 2>&1 || brew install zstd
          command -v create-dmg >/dev/null 2>&1 || brew install create-dmg

      - name: Package macOS mod archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p stfc-community-mod-macos-universal

          tar -cf - \
            -C "build/macosx/arm64/release/STFC Community Mod.app/Contents" \
            libstfc-community-mod.dylib \
            | zstd -10 -T0 \
              -o stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst

          shasum -a 256 \
            stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst \
            | awk '{print $1}' \
            > stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst.sha256

      - name: Create installer
        shell: bash
        run: |
          set -euo pipefail

          create-dmg \
            --filesystem APFS \
            --format ULFO \
            --volname "STFC Community Mod Installer" \
            --volicon assets/launcher.icns \
            --background assets/mac_installer_background.png \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "STFC Community Mod.app" 200 190 \
            --app-drop-link 600 185 \
            stfc-community-mod-installer.dmg \
            build/macosx/arm64/release/

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: stfc-community-mod-installer
          path: stfc-community-mod-installer.dmg
          compression-level: 0
          if-no-files-found: error

      - name: Upload macOS mod archive
        uses: actions/upload-artifact@v7
        with:
          name: stfc-community-mod-macos-universal
          path: stfc-community-mod-macos-universal
          compression-level: 0
          if-no-files-found: error
