[ui]
# Пропускать анимацию открытия контейнеров и сразу открывать их
always_skip_reveal_sequence = true
auto_confirm_discovery = true

# Open the bulk gift claim flyout automatically
auto_open_bulk_claim_flyout = false

# EXPERIMENTAL: Allow officer presets to be reordered in the presets screen
# Shift-click a preset's edit-name button to move it up; Ctrl-click to move it down
# The chosen order is stored locally and does not change Scopely's preset slots
allow_officer_preset_reordering = false

# Highlight deployed fleet-bar portraits in amber when cargo exceeds protected cargo
highlight_opc_fleets = false

# Show estimated time to over-protected cargo below mining fleet status
fleet_hud_opc_eta = false

# Не показывать запрос выхода из игры при нажатии Escape
disable_escape_exit = true

# Maximum gap in milliseconds between Escape presses that opens the exit prompt; 0 disables double-tap exit
disable_escape_exit_timer = 0

# ⚠️ ЭКСПЕРИМЕНТАЛЬНО: Не показывать первое всплывающее рекламное окно
disable_first_popup = false

# ⚠️ ЭКСПЕРИМЕНТАЛЬНО: Отключить стандартные клавиши перемещения
disable_move_keys = false

# ⚠️ ЭКСПЕРИМЕНТАЛЬНО: Отключить стандартные всплывающие баннеры
disable_toast_banners = false

# Subgroup: Auto Confirm
# ----------------------

# Автоматически подтверждать повышение уровня и ранга запретной технологии
auto_confirm_ft_upgrade = false

# Автоматически подтверждаемое действие мгновенного варпа: нет, варп или прыжок
#   "none" - Do not choose an action automatically; show the confirmation dialog
#   "warp" - Automatically choose regular warp
#   "jump" - Automatically choose instant jump
auto_confirm_instant_warp = "none"

# Comma-separated ship hull names for which the instant-warp popup is always shown, overriding all automatic actions
instant_warp_always_ask = ""

# Comma-separated ship hull names to always instant jump; use "*" for all ships or leave blank for none
instant_warp_auto_jump = ""

# Comma-separated ship hull names to always regular warp; use "*" for all ships or leave blank for none
instant_warp_auto_warp = ""

# Subgroup: Banners
# -----------------

# Типы баннеров, которые не следует показывать (через запятую)
disabled_banner_types = ""

# Specifies banner types that should trigger notifications (comma separated)
notify_banner_types = ""

# Subgroup: Chat
# --------------

# Включите, чтобы убрать чат галактики из игры
disable_galaxy_chat = false

# Включите, чтобы убрать чат Завесы из игры
disable_veil_chat = false

# Subgroup: Chest Purchases
# -------------------------

# Maximum for tagged chest-purchase sliders on Windows; 0 disables the feature and native limits above this value are preserved
extend_chest_purchase_max = 160

# Subgroup: Ежедневные цели
# -------------------------

# Фракции через запятую (federation, klingon, romulan), для которых действует переключатель массового получения наград за ежедневные цели; оставьте поле пустым, чтобы сохранить стандартное поведение игры
daily_bulk_claim_factions = ""

# Повторно включает переключатель Получить всё для ежедневных целей при первом открытии экрана в каждом сеансе
daily_bulk_claim_toggle_default_on = false

# Subgroup: Donations
# -------------------

# Расширить ползунок пожертвований до максимума следующего уровня альянса
extend_donation_max = 80

# Включить расширенный ползунок пожертвований
extend_donation_slider = true

# Subgroup: Управление флотом
# ---------------------------

# Используйте стрелки влево и вправо, чтобы выбрать предыдущий или следующий корабль в окне управления флотом
arrow_keys_to_select_ship = true

# Дважды щёлкните корабль в окне управления флотом, чтобы назначить его без выбора и последующего нажатия кнопки назначения
double_click_to_assign_ship = false

# Названия кораблей через запятую, которые всегда отображаются первыми в окне управления флотом; закреплённые корабли сохраняют активный порядок сортировки
pinned_ships = ""

# Subgroup: HUD
# -------------

# HUD visibility mode: auto, show, or hide
#   "auto" - Use the game's default visibility behaviour
#   "show" - Always show this HUD item
#   "hide" - Always hide this HUD item
hud_daily_goals = "auto"

# HUD visibility mode: auto, show, or hide
#   "auto" - Use the game's default visibility behaviour
#   "show" - Always show this HUD item
#   "hide" - Always hide this HUD item
hud_field_training = "auto"

# HUD visibility mode: auto, show, or hide
#   "auto" - Use the game's default visibility behaviour
#   "show" - Always show this HUD item
#   "hide" - Always hide this HUD item
hud_missions = "auto"

# HUD visibility mode: auto, show, or hide
#   "auto" - Use the game's default visibility behaviour
#   "show" - Always show this HUD item
#   "hide" - Always hide this HUD item
hud_outposts = "auto"

# HUD visibility mode: auto, show, or hide
#   "auto" - Use the game's default visibility behaviour
#   "show" - Always show this HUD item
#   "hide" - Always hide this HUD item
hud_q_trials = "auto"

# Subgroup: Previews
# ------------------

# Decimal places used for abbreviated cargo values
cargo_significant_decimals = 2

# Отключить поиск при отображении предпросмотра корабля или узла
disable_preview_locate = false

# Отключить отзыв при отображении предпросмотра корабля или узла
disable_preview_recall = false

# Включите, чтобы всегда показывать награды выбранных кораблей/станций
show_armada_cargo = true

# Включите, чтобы всегда показывать награды выбранных кораблей/станций
show_cargo_default = true

# Включите, чтобы всегда показывать награды выбранных кораблей/станций
show_hostile_cargo = true

