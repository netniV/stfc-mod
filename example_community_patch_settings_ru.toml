[control]
# Интервал двойного нажатия в мс для выбора/поиска кораблей 1–8. Меньше = быстрее, больше = медленнее. По умолчанию 500
select_timer = 500

# Subgroup: Hotkeys
# -----------------

# Если горячие клавиши не нужны, отключите этот параметр (отключает горячие клавиши мода и Scopely)
hotkeys_enabled = true

# Отключите этот параметр, если не хотите использовать расширенные горячие клавиши
hotkeys_extended = true

# Следует ли включать очередь по умолчанию при наличии артефакта Кир'Шара?
queue_enabled = true

# Включите этот параметр, если предпочитаете горячие клавиши Scopely
use_scopely_hotkeys = false

# Subgroup: Options
# -----------------

# Включить экспериментальные функции
enable_experimental = false

