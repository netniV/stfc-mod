[graphics]

# Subgroup: Display
# -----------------

# Frame-rate scaling factor
fr_scale = 2.0

# Время между переходами; увеличьте значение, чтобы замедлить переходы
transition_time = 0.01

# Коэффициент масштабирования интерфейса; по умолчанию 1,0
ui_scale = 0.6

# Шаг изменения масштаба; по умолчанию 0,05
ui_scale_adjust = 0.05

# Масштаб моделей кораблей в системном виде; по умолчанию 1,0
ui_scale_ship = 1.0

# Масштаб окон просмотра объектов интерфейса; по умолчанию 1,0
ui_scale_viewer = 1.2

# Subgroup: Fleet Labels
# ----------------------

# Label detail shown for non-player and unknown fleets in System View
#   "native" - Use Scopely's Near/Middle/Far behaviour
#   "expanded" - Always show long fleet labels
#   "compact" - Always show compact fleet labels
#   "threshold" - Switch from expanded to compact at the configured zoom threshold
zoom_label_non_player_detail = "native"

# Normalized zoom crossover used when non-player fleet label detail is "threshold"; 0 is always compact and 1 is always expanded
zoom_label_non_player_threshold = 0.5

# Label detail shown for player fleets in System View
#   "native" - Use Scopely's Near/Middle/Far behaviour
#   "expanded" - Always show long fleet labels
#   "compact" - Always show compact fleet labels
#   "threshold" - Switch from expanded to compact at the configured zoom threshold
zoom_label_player_detail = "native"

# Normalized zoom crossover used when player fleet label detail is "threshold"; 0 is always compact and 1 is always expanded
zoom_label_player_threshold = 0.5

# Subgroup: Keyboard
# ------------------

# Скорость изменения масштаба клавишами Q/E в системном виде; по умолчанию 350
keyboard_zoom_speed = 350.0

# Скорость инерции перемещения системы. По умолчанию 0,4
system_pan_momentum = 0.4

# Скорость затухания инерции после отпускания мыши. Меньше = более быстрая остановка. По умолчанию 0,8
system_pan_momentum_falloff = 0.8

# Subgroup: Loader
# ----------------

# Включите, чтобы использовать loader_image на экране загрузки
loader_enabled = true

# Путь к пользовательскому изображению экрана загрузки (оставьте пустым для встроенного изображения)
loader_image = ""

# Multiplier applied to the logo size on the loading screen
loader_logo_scale = 1.0

# Show the custom tip on the loading screen
loader_tip_enabled = true

# Включите, чтобы использовать изображение загрузки на экране перехода
loader_transition = true

# Use a black background instead of the custom image during transitions
loader_transition_black = false

# Subgroup: Options
# -----------------

# Разрешить замену системного курсора? (По умолчанию включено)
allow_cursor = true

# Разрешить полноэкранный режим без рамки; отключите параметр, чтобы запретить его
borderless_fullscreen = true

# Разрешить свободное изменение размера; отключите параметр, чтобы запретить его
free_resize = true

# После применения шаблона масштаба он станет масштабом по умолчанию
use_presets_as_default = true

# Subgroup: Zoom
# --------------

# Установите 0,0, чтобы отключить пользовательский масштаб; иначе система откроется с указанным масштабом
default_system_zoom = 1750.0

# Шаблон масштаба F1 для системного вида
system_zoom_preset_1 = 50.0

# Шаблон масштаба F2 для системного вида
system_zoom_preset_2 = 500.0

# Шаблон масштаба F3 для системного вида
system_zoom_preset_3 = 1250.0

# Шаблон масштаба F4 для системного вида
system_zoom_preset_4 = 2750.0

# Шаблон масштаба F5 для системного вида
system_zoom_preset_5 = 5000.0

# Максимальная дистанция масштаба в системном виде. По умолчанию 2500. Большие значения увеличивают дальность отображения меток
zoom = 5000.0

